      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: mysecretkeymysecretkeymysecretkey123456789
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html