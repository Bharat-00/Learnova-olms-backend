server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

        - id: course-service
          uri: lb://course-service
          predicates:
            - Path=/api/v1/courses/**

        - id: enrollment-service
          uri: lb://enrollment-service
          predicates:
            - Path=/api/v1/enrollments/**

        - id: lesson-service
          uri: lb://lesson-service
          predicates:
            - Path=/api/v1/lessons/**

        - id: assesment-service
          uri: lb://assesment-service
          predicates:
            - Path=/api/v1/quizzes/**,/api/v1/attempts/**

        - id: progress-service
          uri: lb://progress-service
          predicates:
            - Path=/api/v1/progress/**

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**,/api/v1/subscriptions/**

        - id: discussion-service
          uri: lb://discussion-service
          predicates:
            - Path=/api/v1/discussions/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**

        - id: certificate-service
  uri: lb://certificate-service
  predicates:
    - Path=/api/certificates/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

        jwt:
  secret: learnova_super_secret_key_for_jwt_validation_2026