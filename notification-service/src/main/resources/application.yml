server:
  port: 8090

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:mysql://localhost:3306/learnova_notification_db?createDatabaseIfNotExist=true
    username: root
    password: Bharat_007
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

rabbitmq:
  exchange:
    payment: payment.exchange
  queue:
    payment-success: notification.payment.success.queue
  routing-key:
    payment-success: payment.success

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html