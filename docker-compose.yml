      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/learnova_user_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Bharat_007
